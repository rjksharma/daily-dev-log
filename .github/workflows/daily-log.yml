
name: Daily Development Log

on:
  schedule:
    - cron: "30 19 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-log:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate random activity records
        env:
          GITHUB_USERNAME: ${{ vars.MY_GITHUB_USERNAME }}
        run: python daily_log.py

      - name: Commit each activity separately
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -d logs ]; then
            echo "No activity records generated."
            exit 0
          fi

          count=0

          while IFS= read -r -d '' file; do
            git add -- "$file"

            if git diff --cached --quiet; then
              continue
            fi

            git commit -m "docs: record development activity"
            count=$((count + 1))

          done < <(find logs -type f -name 'event-*.md' -print0)

          if [ "$count" -gt 0 ]; then
            git push
          fi

          echo "New activity commits: $count"
