
name: Daily Development Log

on:
  schedule:
    - cron: "30 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-log:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate practice records
        run: python daily_log.py

      - name: Configure Git identity
        env:
          COMMIT_EMAIL: ${{ vars.COMMIT_EMAIL }}
        run: |
          git config user.name "rjksharma"
          git config user.email "$COMMIT_EMAIL"

      - name: Create separate commits
        shell: bash
        run: |
          count=0

          while IFS= read -r -d '' file; do
            git add -- "$file"

            if git diff --cached --quiet; then
              continue
            fi

            git commit -m "chore: Git automation practice record"
            count=$((count + 1))

          done < <(find logs -type f -name 'commit-*.md' -print0)

          echo "Total new commits: $count"

          if [ "$count" -gt 0 ]; then
            git push origin HEAD:main
          else
            echo "No new records to commit."
          fi
