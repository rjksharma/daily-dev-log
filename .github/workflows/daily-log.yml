
name: Daily Development Log

on:
  schedule:
    - cron: "30 19 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-log:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate random practice records
        run: python daily_log.py

      - name: Create separate commits
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          count=0

          while IFS= read -r -d '' file; do
            git add -- "$file"

            git commit -m "chore: add Git automation practice record"
            count=$((count + 1))

          done < <(find logs -type f -name 'commit-*.md' -print0)

          if [ "$count" -gt 0 ]; then
            git push
          fi

          echo "Total separate commits created: $count"
